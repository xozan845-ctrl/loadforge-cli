name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: android
            goarch: arm64
            asset: loadforge-termux-arm64
          - goos: linux
            goarch: amd64
            asset: loadforge-linux-amd64
          - goos: linux
            goarch: arm64
            asset: loadforge-linux-arm64
          - goos: windows
            goarch: amd64
            asset: loadforge-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            asset: loadforge-darwin-arm64
          - goos: darwin
            goarch: amd64
            asset: loadforge-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${VERSION#v}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/xozan845-ctrl/loadforge-cli/internal/version.Version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" ./cmd/loadforge

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: LoadForge ${{ github.ref_name }}
